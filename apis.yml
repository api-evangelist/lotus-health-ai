name: Lotus Health AI
description: 'Lotus Health AI (branded Lotus AI, at lotus.ai) is an AI-powered consumer
  healthcare platform delivered through an iOS app that pairs artificial intelligence
  trained on medical evidence with licensed physicians to provide personalized medical
  care. The service offers AI-guided care plans built from a member''s health data,
  prescriptions sent to any pharmacy in the United States, lab ordering across 6,000+
  test sites nationwide, centralized medical-record management, and 24/7 availability.
  The company is a portfolio company of Kleiner Perkins in the healthcare sector.
  As of this profile the company exposes a consumer mobile product and physician tooling
  (Cortex) but publishes no public developer API, SDK, or developer portal.'
